<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jezero 3D route</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
  :root { --bg: #0f1114; --panel: rgba(23,26,31,.94); --line: #2c313a; --text: #e6e8eb; --muted: #9aa3ae;
    --accent: #e8794a; --route: #ffb347; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; height: 100%; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0b0c0e; }
  .leaflet-container { background: #0b0c0e; font: inherit; }
  .card { position: absolute; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  button, select { background: #1f232a; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #title { top: 12px; left: 12px; padding: 8px 12px; max-width: min(360px, calc(100% - 250px)); }
  #title h1 { font-size: 15px; margin: 0; }
  #title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .key { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  @media (max-width: 640px) {
    #title { max-width: calc(100% - 196px); }
    #title p { display: none; }
  }
</style>
<link rel="stylesheet" href="../reconstructions.css">
<link rel="stylesheet" href="../route-view.css">
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="title" class="card">
    <h1>Jezero · route over the relief</h1>
    <p><span class="key" style="background:var(--route)"></span>planned route ·
       <span class="key" style="background:#9fd3ff"></span>shortest-distance A* · dots: science stops</p>
  </div>

</div>

<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
import { initRouteView } from "../route-view.mjs";
import { initReconstructions, mountReconstructionPanel } from "../reconstructions.mjs";

const cfgResponse = await fetch("/api/map-config");
if (!cfgResponse.ok) throw new Error("Start the viewer with python3 backend/viewer.py");
const cfg = await cfgResponse.json(), R = cfg.radius, DEG = Math.PI / 180;
const crs = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1 / cfg.res0, -cfg.left / cfg.res0, -1 / cfg.res0, cfg.top / cfg.res0),
});
const ll = (lon, lat) => L.latLng(R * lat * DEG, R * lon * DEG);
const map = L.map("map", {crs, zoomSnap: .5, minZoom: 0, maxZoom: 7});
map.attributionControl.setPrefix(false).addAttribution("CTX: NASA/JPL/MSSS/USGS · relief: CTX DTM / NASA Mars Trek");
const full = L.latLngBounds([cfg.bottom, cfg.left], [cfg.top, cfg.right]);
if (cfg.ctx) {
  for (const tile of cfg.ctx.tiles) L.imageOverlay(`/assets/ctx/${tile.file}`,
    [ll(tile.lon_min, tile.lat_min), ll(tile.lon_max, tile.lat_max)]).addTo(map);
} else {
  const layer = cfg.layers.find(layer => layer.id === "ctx_ortho_6m");
  if (layer) L.tileLayer(`/data/tiles/${layer.id}/{z}/{x}/{y}.${layer.ext}`, {
    maxNativeZoom: layer.maxzoom, maxZoom: 7, tileSize: cfg.tile, noWrap: true, bounds: full,
  }).addTo(map);
}
L.control.scale({imperial: false}).addTo(map);
map.fitBounds(full);
const container = document.querySelector("#wrap");
const routes = await initRouteView({map, cfg, container});
mountReconstructionPanel(container);
await initReconstructions({map, cfg, container, terrain: routes.terrain, fitOnLoad: false});
</script>
</body>
</html>
