<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MARPS · Surface view</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="surface.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/","@sparkjsdev/spark":"./vendor/spark/spark.module.js"}}
  </script>
</head>
<body>
  <div id="view" tabindex="0" aria-label="3D reconstruction. Drag to look around; use W A S D or the arrow keys to move."></div>
  <div id="loading" role="status"><strong id="loadingTitle">Preparing the reconstruction…</strong><p id="loadingDetail">The model loads on entry and may take a few seconds.</p><button id="retry" hidden onclick="location.reload()">Retry</button></div>
  <div id="toolbar"><button id="walk" aria-pressed="true">On foot · 1.65 m</button><button id="orbit" aria-pressed="false">Orbit view</button><button id="reset">Reset view</button><select id="quality" aria-label="Model quality"><option value="auto">Automatic quality</option><option value="full">Full detail</option><option value="light">Light quality</option></select><button id="fullscreen">Fullscreen</button></div>
  <div id="help">Drag to look around · W A S D / arrow keys to walk · Esc to return to the map</div>
  <div id="position" role="status"></div>
  <div id="touchControls" aria-label="Movement controls">
    <button data-move="forward" aria-label="Move forward">↑</button>
    <div><button data-move="left" aria-label="Move left">←</button><button data-move="back" aria-label="Move back">↓</button><button data-move="right" aria-label="Move right">→</button></div>
  </div>
  <script type="module">
    import("./surface.mjs").then(module => module.start()).catch(error => {
      document.querySelector("#loading").hidden = false;
      document.querySelector("#loadingTitle").textContent = "Could not open the reconstruction";
      document.querySelector("#loadingDetail").textContent = `${error.message}. Check that WebGL2 is available and run python3 backend/prepare_viewer.py if the libraries are missing.`;
      document.querySelector("#retry").hidden = false;
      console.error(error);
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") parent.postMessage("marps:close-surface", location.origin);
    });
  </script>
</body>
</html>
